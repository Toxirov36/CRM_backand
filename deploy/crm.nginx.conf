server {
    listen 80;
    listen [::]:80;
    server_name crm.37-60-247-120.sslip.io;

    root /var/www/letsencrypt;
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name crm.37-60-247-120.sslip.io;

    ssl_certificate /etc/letsencrypt/live/crm.37-60-247-120.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.37-60-247-120.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;

    root /opt/studycrm/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
    }

    location /files/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
    }

    location /swagger {
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
