services:
  db:
    image: postgres:16-alpine
    container_name: studycrm-db
    restart: unless-stopped
    env_file: ../../.db.env
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - ../../postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
